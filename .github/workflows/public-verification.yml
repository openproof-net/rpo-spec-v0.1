name: Public verification example
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/public-verification.test.cjs tests/campaign-walkthrough.test.cjs
      - run: node tools/verify-demo.cjs examples/public-demo/rpo-en.json examples/public-demo/rpo-en.sha256
      - run: node --check docs/assets/campaign-walkthrough.mjs
      - run: node --check docs/assets/campaign-brief.js
